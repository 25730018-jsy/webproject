<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palette - 스타일·무드별 메이크업 조합 & 뷰티 템 탐색 서비스</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- App Container (Mobile 375pt 최적화) -->
  <div id="app">

    <!-- GNB / Header -->
    <header class="header">
      <h1 class="logo">Palette</h1>
      <nav class="nav">
        <button type="button" class="nav-btn active" id="btnNavHome">홈</button>
        <button type="button" class="nav-btn" id="btnNavList">조합 목록</button>
        <button type="button" class="nav-btn" id="btnNavPouch">마이 파우치</button>
      </nav>
    </header>

    <!-- Main Content -->
    <main class="content">

      <!-- 검색 영역 -->
      <section class="search-section">
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="브랜드명 또는 세트 키워드 검색">
          <button type="button" id="btnSearch">검색</button>
        </div>
      </section>

      <!-- 필터 영역 (사계절 세부 톤 & 스타일 무드) -->
      <section class="filter-section">
        <div class="filter-group">
          <h3>사계절 세부 톤</h3>
          <div class="tag-group" id="toneFilterGroup">
            <button type="button" class="tag-btn active" data-filter-type="tone" data-filter-val="all">전체</button>
            <button type="button" class="tag-btn" data-filter-type="tone" data-filter-val="봄라이트">봄라이트</button>
            <button type="button" class="tag-btn" data-filter-type="tone" data-filter-val="여름뮤트">여름뮤트</button>
            <button type="button" class="tag-btn" data-filter-type="tone" data-filter-val="가을딥">가을딥</button>
            <button type="button" class="tag-btn" data-filter-type="tone" data-filter-val="겨울스트롱">겨울스트롱</button>
          </div>
        </div>

        <div class="filter-group">
          <h3>스타일 무드</h3>
          <div class="tag-group" id="moodFilterGroup">
            <button type="button" class="tag-btn" data-filter-type="mood" data-filter-val="#음영메이크업">#음영메이크업</button>
            <button type="button" class="tag-btn" data-filter-type="mood" data-filter-val="#맑은속광">#맑은속광</button>
            <button type="button" class="tag-btn" data-filter-type="mood" data-filter-val="#글로우">#글로우</button>
          </div>
        </div>
      </section>

      <!-- 결과 목록 영역 -->
      <section class="result-section">
        <div class="result-header">
          <span class="result-count">검색 결과 <strong id="resultCountNum">3</strong>건</span>
          <select id="sortSelect">
            <option value="popular">인기순</option>
            <option value="latest">최신순</option>
            <option value="priceLow">낮은가격순</option>
          </select>
        </div>

        <!-- 카드 리스트 컨테이너 -->
        <div class="card-list" id="cardList"></div>

        <!-- 검색 결과 없음 (Empty State) -->
        <div class="empty-state hidden" id="emptyState">
          <p class="empty-title">선택하신 조건에 맞는 세트가 없습니다.</p>
          <p class="empty-sub">다른 세부 톤이나 필터를 해제하고 다시 검색해 보세요.</p>
          <button type="button" id="btnResetFilter">필터 전체 초기화</button>
        </div>
      </section>

    </main>

    <!-- 하단 고정 네비게이션 바 (Bottom Navigation Bar) -->
    <nav class="bottom-nav">
      <button type="button" class="bottom-nav-btn active" id="bNavHome">
        <span class="b-icon">🏠</span>
        <span>홈</span>
      </button>
      <button type="button" class="bottom-nav-btn" id="bNavList">
        <span class="b-icon">💄</span>
        <span>조합 목록</span>
      </button>
      <button type="button" class="bottom-nav-btn" id="bNavPouch">
        <span class="b-icon">👝</span>
        <span>마이 파우치</span>
      </button>
    </nav>

  </div>

  <!-- 상세보기 모달 (Modal Popup) -->
  <div class="modal-overlay hidden" id="detailModal">
    <div class="modal-content">
      <button type="button" class="modal-close" id="btnCloseModal">&times;</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
