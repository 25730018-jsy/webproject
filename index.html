<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palette - 퍼스널 컬러 메이크업 조합 탐색</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- App Container -->
  <div id="app">

    <!-- Header -->
    <header class="header">
      <h1 class="logo">Palette</h1>
      <nav class="nav">
        <button type="button" class="nav-btn active" id="btnNavHome" onclick="switchTab('home')">홈</button>
        <button type="button" class="nav-btn" id="btnNavList" onclick="switchTab('list')">조합 목록</button>
        <button type="button" class="nav-btn" id="btnNavPouch" onclick="switchTab('pouch')">마이 파우치</button>
      </nav>
    </header>

    <!-- Main Content -->
    <main class="content">

      <!-- 퍼스널컬러 선택 섹션 (홈 탭 전용) -->
      <section class="personal-color-section" id="personalColorSection">
        <div class="pc-header">
          <h2>퍼스널컬러 진단 · 12톤 팔레트</h2>
          <p>나에게 딱 맞는 톤을 선택하고 조합을 확인하세요</p>
        </div>

        <!-- 1단계: 4계절 선택 -->
        <div class="season-group" id="seasonGroup">
          <button type="button" class="season-btn active" onclick="selectSeason('봄', this)">봄</button>
          <button type="button" class="season-btn" onclick="selectSeason('여름', this)">여름</button>
          <button type="button" class="season-btn" onclick="selectSeason('가을', this)">가을</button>
          <button type="button" class="season-btn" onclick="selectSeason('겨울', this)">겨울</button>
        </div>

        <!-- 2단계: 세부 3톤 선택 -->
        <div class="subtone-title">세부 톤 선택</div>
        <div class="subtone-group" id="subtoneGroup">
          <!-- JS 동적 생성 -->
        </div>
      </section>

      <!-- 준비중 안내 영역 (조합 목록 / 마이 파우치 전용) -->
      <section class="placeholder-section hidden" id="placeholderSection">
        <p>준비 중인 기능입니다.</p>
      </section>

    </main>

    <!-- 하단 고정 네비게이션 -->
    <nav class="bottom-nav">
      <button type="button" class="bottom-nav-btn active" id="bNavHome" onclick="switchTab('home')">
        <span class="b-icon">🏠</span>
        <span>홈</span>
      </button>
      <button type="button" class="bottom-nav-btn" id="bNavList" onclick="switchTab('list')">
        <span class="b-icon">💄</span>
        <span>조합 목록</span>
      </button>
      <button type="button" class="bottom-nav-btn" id="bNavPouch" onclick="switchTab('pouch')">
        <span class="b-icon">👝</span>
        <span>마이 파우치</span>
      </button>
    </nav>

  </div>

  <script src="app.js"></script>
</body>
</html>
